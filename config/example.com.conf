server {

    listen                  80;
    listen                  [::]:80;
    server_name             example.com;

    # TEST ONLY: trust X-Forwarded-For so local smoke tests can fake the
    # client IP (e.g. to exercise geoip2 lookups without a real public IP).
    # Do not carry this trust-all rule into a real production vhost.
    set_real_ip_from        0.0.0.0/0;
    real_ip_header          X-Forwarded-For;
    real_ip_recursive       off;

    location / {
        default_type        text/plain;
        return              200 'Hello, this is $host :)\n';
    }

    location /files {
        alias               /var/www/html;
        autoindex           on;
    }

    #curl --header 'Host: example.com' http://localhost/lua
    location /lua {
        default_type text/plain;
        content_by_lua_block {
            local hello = require("sample").hello()
            local env = os.getenv("ENV_VARIABLE")
            ngx.say("Message is: '"..hello.."' and '"..env.."'")
        }
    }

    #curl --header 'Host: example.com' --header 'X-Forwarded-For: 8.8.8.8' http://localhost/geoip
    location /geoip {
        default_type        text/plain;
        return               200 'remote_addr=$remote_addr country_code=$geoip2_data_country_code country_name=$geoip2_data_country_name city_name=$geoip2_data_city_name\n';
    }

}
